    <script>
      // Container preview environment: handle benign Vite HMR websocket and console messages
      (function () {
        if (typeof window === 'undefined') return;

        // 1. Mock WebSocket for Vite HMR to prevent connection error spam in sandboxed container
        if (window.WebSocket) {
          const OriginalWebSocket = window.WebSocket;
          function MockViteWebSocket(url, protocols) {
            const isVite =
              (typeof protocols === 'string' && (protocols === 'vite-hmr' || protocols === 'vite-ping')) ||
              (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping'))) ||
              (typeof url === 'string' && (url.includes('token=') || url.includes('vite')));

            if (!isVite) {
              return new OriginalWebSocket(url, protocols);
            }

            const listeners = {};
            const ws = {
              url: String(url),
              readyState: 1, // OPEN
              protocol: typeof protocols === 'string' ? protocols : (protocols && protocols[0]) || 'vite-hmr',
              extensions: '',
              bufferedAmount: 0,
              binaryType: 'blob',
              onopen: null,
              onmessage: null,
              onerror: null,
              onclose: null,
              addEventListener(type, listener) {
                if (!listeners[type]) listeners[type] = [];
                listeners[type].push(listener);
              },
              removeEventListener(type, listener) {
                if (listeners[type]) {
                  listeners[type] = listeners[type].filter(function (l) { return l !== listener; });
                }
              },
              dispatchEvent(event) {
                const type = event && event.type;
                if (typeof ws['on' + type] === 'function') {
                  try { ws['on' + type](event); } catch (e) {}
                }
                if (listeners[type]) {
                  listeners[type].forEach(function (l) {
                    try { l(event); } catch (e) {}
                  });
                }
                return true;
              },
              send: function () {},
              close: function () {
                ws.readyState = 3;
                ws.dispatchEvent({ type: 'close', wasClean: true, code: 1000, reason: '' });
              }
            };

            setTimeout(function () {
              if (ws.readyState === 1) {
                ws.dispatchEvent({ type: 'open' });
              }
            }, 10);

            return ws;
          }

          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;
          MockViteWebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket = MockViteWebSocket;
        }

        // 2. Filter benign Vite logs and console.error calls
        const origError = console.error;
        const origWarn = console.warn;
        console.error = function (...args) {
          if (typeof args[0] === 'string' && (args[0].startsWith('[vite]') || args[0].includes('vite'))) {
            return;
          }
          origError.apply(console, args);
        };
        console.warn = function (...args) {
          if (typeof args[0] === 'string' && (args[0].startsWith('[vite]') || args[0].includes('vite'))) {
            return;
          }
          origWarn.apply(console, args);
        };
      })();
    </script>
